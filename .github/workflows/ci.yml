name: workflow-engine
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow_test
          POSTGRES_DB: workflow_engine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://workflow:workflow_test@127.0.0.1:5432/workflow_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
